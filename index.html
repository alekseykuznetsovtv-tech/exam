<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен (Соло - Отладка)</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <style>
        body { 
            background-color: #000000; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: pointer;
            user-select: none;
        }
        #answer-display {
            color: #d2691e;
            font-size: 7vw;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 10;
        }
        /* В режиме отладки статус будет более заметным */
        #status {
            position: absolute; 
            top: 10px; 
            left: 10px; 
            right: 10px;
            font-size: 14px; 
            color: #888888; 
            z-index: 5;
            word-wrap: break-word;
        }
    </style>
</head>
<body onclick="toggleListen()">

    <div id="status">Нажми на экран для старта</div>
    <div id="answer-display"></div>

    <script>
        window.onerror = function(msg, url, line) {
            alert("Ошибка в коде на строке " + line + ":\n" + msg);
        };

        const MATCH_THRESHOLD = 0.4;

        // Пока здесь только 2 вопроса для теста!
        const database = [
            { q: "В КАКОМ СЛУЧАЕ ЭЛЕМЕНТ ЗАЗЕМЛИТЕЛЯ ДОЛЖЕН БЫТЬ ЗАМЕНЕН?", a: "Если разрушено более 50 % его сечения" },
            { q: "КАКУЮ ГРУППУ ПО ЭЛЕКТРОБЕЗОПАСНОСТИ ДОЛЖНЫ ИМЕТЬ РАБОТНИКИ ИЗ ЧИСЛА ОПЕРАТИВНОГО ПЕРСОНАЛА, ЕДИНОЛИЧНО ОБСЛУЖИВАЮЩИЕ ЭЛЕКТРОУСТАНОВКИ НАПРЯЖЕНИЕМ ВЫШЕ 1000 В?", a: "Группу не ниже IV" }
        ];

        const fuse = new Fuse(database, { includeScore: true, threshold: 0.6, keys: ['q'] });
        
        let recognition;
        try {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.continuous = true;
                recognition.interimResults = false;
            }
        } catch (err) {
            alert("Ошибка: " + err.message);
        }

        let isListening = false;
        let hideTimeout;
        const statusDiv = document.getElementById('status');
        const answerDiv = document.getElementById('answer-display');

        function toggleListen() {
            if (!recognition) return;

            if (isListening) {
                isListening = false;
                recognition.stop();
                statusDiv.textContent = "Остановлено";
            } else {
                isListening = true;
                recognition.start();
                statusDiv.textContent = "Слушаю...";
            }
        }

        if (recognition) {
            recognition.onend = () => { 
                if (isListening) recognition.start(); 
            };

            recognition.onerror = (event) => {
                statusDiv.textContent = "Ошибка микрофона: " + event.error;
            };

            recognition.onresult = (event) => {
                // Берем услышанную фразу
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                
                // ВЫВОДИМ ТО, ЧТО УСЛЫШАЛ ТЕЛЕФОН НА ЭКРАН
                statusDiv.textContent = "Услышал: " + transcript;
                
                const results = fuse.search(transcript);
                
                if (results.length > 0) {
                    if (results[0].score <= MATCH_THRESHOLD) {
                        // Успех!
                        statusDiv.textContent = "Нашел! (Точность: " + results[0].score.toFixed(2) + ")";
                        answerDiv.textContent = results[0].item.a;
                        answerDiv.style.opacity = 1;
                        
                        clearTimeout(hideTimeout);
                        hideTimeout = setTimeout(() => {
                            answerDiv.style.opacity = 0;
                            statusDiv.textContent = "Слушаю...";
                        }, 15000);
                    } else {
                        // Нашел похожее, но точность плохая
                        statusDiv.textContent = "Слабое совпадение (Точность " + results[0].score.toFixed(2) + ") с: " + results[0].item.q;
                    }
                } else {
                    // Вообще ничего похожего не нашел
                    statusDiv.textContent = "В базе нет ничего похожего на: " + transcript;
                }
            };
        }
    </script>
</body>
</html>
