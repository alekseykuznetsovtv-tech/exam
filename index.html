<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Микрофон (Слухач)</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; padding: 20px; }
        button { padding: 15px; width: 100%; font-size: 18px; background: #333; color: white; border: 1px solid #555; border-radius: 8px; margin-bottom: 20px;}
        button.active { background: #8b0000; }
        #log { background: #1e1e1e; padding: 15px; border-radius: 8px; min-height: 200px; font-size: 14px;}
        .match { color: #4CAF50; }
    </style>
</head>
<body>
    <h2>Слухач</h2>
    <button id="btn-listen">Начать прослушивание</button>
    <div id="log">Подключение к серверу...<br></div>

    <script>
        // Придумай свой уникальный пароль/канал, чтобы никто случайно не подключился
        const TOPIC = "vorkuta_eb4_secret_channel_777"; 
        const MATCH_THRESHOLD = 0.4;

        // База теперь содержит текст ответа (a), а не цифру
        const database = [
            { q: "В КАКОМ СЛУЧАЕ ЭЛЕМЕНТ ЗАЗЕМЛИТЕЛЯ ДОЛЖЕН БЫТЬ ЗАМЕНЕН?", a: "Если разрушено более 50 % его сечения" },
            { q: "КАКУЮ ГРУППУ ПО ЭЛЕКТРОБЕЗОПАСНОСТИ ДОЛЖНЫ ИМЕТЬ РАБОТНИКИ ИЗ ЧИСЛА ОПЕРАТИВНОГО ПЕРСОНАЛА, ЕДИНОЛИЧНО ОБСЛУЖИВАЮЩИЕ ЭЛЕКТРОУСТАНОВКИ НАПРЯЖЕНИЕМ ВЫШЕ 1000 В?", a: "Группу не ниже IV" }
        ];

        const fuse = new Fuse(database, { includeScore: true, threshold: 0.6, keys: ['q'] });
        const logDiv = document.getElementById('log');
        function logMsg(msg, cls='') { logDiv.innerHTML += `<span class="${cls}">${msg}</span><br>`; logDiv.scrollTop = logDiv.scrollHeight; }

        // Настройка MQTT клиента (бесплатный сервер HiveMQ)
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "/mqtt", "clientId_" + parseInt(Math.random() * 100000));
        
        client.onConnectionLost = (responseObject) => { logMsg("Отключено от сервера. Обновите страницу."); };
        
        client.connect({
            onSuccess: () => { logMsg("Успешно подключено к серверу связи!"); }
        });

        // Настройка микрофона
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = true;
        recognition.interimResults = false;

        let isListening = false;
        const btnListen = document.getElementById('btn-listen');

        btnListen.onclick = () => {
            if (isListening) recognition.stop();
            else recognition.start();
        };

        recognition.onstart = () => { isListening = true; btnListen.textContent = "Слушаю..."; btnListen.classList.add('active'); };
        recognition.onend = () => { isListening = false; btnListen.textContent = "Начать прослушивание"; btnListen.classList.remove('active'); };
        
        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim();
            logMsg(`Услышал: "${transcript}"`);

            const results = fuse.search(transcript);
            if (results.length > 0 && results[0].score <= MATCH_THRESHOLD) {
                const answerText = results[0].item.a;
                logMsg(`Нашел ответ: ${answerText}`, 'match');
                
                // Отправляем текст ответа на второй телефон
                if (client.isConnected()) {
                    const message = new Paho.MQTT.Message(answerText);
                    message.destinationName = TOPIC;
                    client.send(message);
                }
            } else {
                logMsg("В базе нет совпадений.");
            }
        };
    </script>
</body>
</html>
